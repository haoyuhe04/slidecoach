[project]
name = "slidecoach"
version = "0.1.0"
description = "Course-grounded adaptive practice and teach-back"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1", "python-pptx>=1.0,<2", "pymupdf>=1.25,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
